<html>
    <head>
        <title>Vehicle Rental Management System</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <a href="index.html" class="logo">Logo</a>
            <div class="nav-links">
                <a href="index.html">Home</a> 
                <a href="vehicles.html">Vehicles & Rates</a>
                <a href="bookings.html">Bookings</a>
            </div>
            <div class="profile-container">
                <a href="index.html" class="profile-btn">Add Customer</a>
            </div>
        </nav>
        <section>
            <div class="vhs-rates">
                <h1>Vehicles & Rates</h1>
                <p class="addvhc"><input type="button" value=" +  Add Vehicle" onclick="addvehicle()"></p>
            </div>
            <div class="vehicle-container">
                <div class="vehiclelist">
                    <div class="vtitle">
                        <h1>Vehicles</h1>
                    </div>
                    <input type="button" value="2019 Toyota Avanza Black" onclick="displayDetails()">
                    <input type="button" value="2019 Toyota Avanza Gray" onclick="displayDetails()">
                    <input type="button" value="Toyota Vios" onclick="displayDetails()">
                </div>
                <div class="vehicledetails">
                    <div class="vehicle1">
                        <div class="vhcedit">
                            <h1>Edit Vehicle</h1>
                            <input type="text" value="Available">
                        </div>
                        <h1>2019 Toyota Avanza Black</h1>
                        <p>
                            <label for="seaters">Seaters</label>
                            <select id="seaters">
                                <option value="7 Seaters">7 Seaters</option>
                                <option value="7 Seaters">7 Seaters</option>
                                <option value="5 Seaters">9 Seaters</option>
                            </select>
                            <label for="driver">Driver</label>
                            <input type="text" value="Gregorio P. Colagbang">
                        </p>
                        <p>
                            <label for="vtype">Vehicle Type</label>
                            <select id="vtype">
                                <option value="Subcompact multi-purpose vehicle (MPV)">Subcompact multi-purpose vehicle (MPV)</option>
                                <option value="Subcompact Sedan">Subcompact Sedan</option>
                                <option value="Sport Utility Vehicle (SUV)">Sport Utility Vehicle (SUV)</option>
                            </select>
                        </p>
                        <p>
                            <label for="rrate">Rental Rate</label>
                            <input type="rate" value="₱ 1700">
                            <label for="duration">Duration</label>
                            <input type="drntime" value="8 to 10 hrs">
                        </p>
                        <p>
                            <input type="button" value="Edit" onclick="editvehicle()">
                            <input type="button" value="Add Vehicle" onclick="addvehicle()">
                        </p>
                    </div>
                </div> 
            </div>
        </section>
        <script>
            //saving data
            var savedData = localStorage.getItem("vehicles_db");
              if (savedData == null) {
            
            var car = [];
 
            localStorage.setItem(
                "vehicles_db",
                JSON.stringify(customer)
            );
 
            } else {
 
            var customer = JSON.parse(savedData);
 
            }
        </script>
    </body>
</html>
