    <script type="text/javascript">
        var savedData = localStorage.getItem("renting_db");
        var customer = savedData ? JSON.parse(savedData) : [];

        function displaycustomer() {
            var table = "";
            for (var i = 0; i < customer.length; i++) {
                table += "<tr>";
                table += "<td>" + customer[i].name + "</td>";
                table += "<td>" + customer[i].email + "</td>";
                table += "<td>" + customer[i].cnum + "</td>";
                table += "<td>" + customer[i].pckpdate + " / " + formatTime(customer[i].pckptime) + "</td>";
                table += "<td>" + customer[i].rtrndate + " / " + formatTime(customer[i].rtrntime) + "</td>";
                table += "<td>" + customer[i].price + "</td>";
                table += "<td>" + customer[i].pickuploc + "</td>";
                table += "<td>" + customer[i].returnloc + "</td>";

                table += "<td>";
 
                table += "<a href='edit.html?edit=" + i + "'>";
                table += "<input type='button' value='Edit'>";
                table += "</a> ";

                table += "<input type='button' value='Delete' ";
                table += "onclick='deleteCustomer(" + i + ")'>";
 
                table += "</td>";
 
                table += "</tr>";
            }
            document.getElementById("customerTable").innerHTML = table;
        }
        function formatTime(time) {
            if (!time) return "";
                var parts = time.split(":");
                var hours = parseInt(parts[0], 10);
                var minutes = parts[1];
                var suffix = hours >= 12 ? "PM" : "AM";
                hours = hours % 12;
            if (hours === 0) hours = 12;
                return hours + ":" + minutes + " " + suffix;
            }

        displaycustomer();

        function deleteCustomer(index) {
 
            var answer = confirm(
                "Are you sure you want to delete " +
                customer[index].name + "?"
            );
 
            if (answer == true) {
 
                customer.splice(index, 1);
 
                localStorage.setItem(
                    "renting_db",
                    JSON.stringify(customer)
                );
                displaycustomer();
                alert("Customer deleted successfully.");
 
                document.getElementById("message").innerHTML =
                    "Customer deleted successfully.";
 
                displaycustomer();
 
            } else {
 
                alert("Delete cancelled.");
 
            }
        }
