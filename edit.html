<html>
    <head>
        <title>Vehicle Rental Management System</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body class="homebg">
        <nav class="navbar">
            <a href="index.html" class="logo">Logo</a>
            <div class="nav-links">
                <a href="index.html">Home</a> 
                <a href="vehicles.html">Vehicles & Rates</a>
                <a href="bookings.html">Bookings</a>
            </div>
           <div class="profile-container">
                <a href="index.html" class="profile-btn">Add Customer</a>
            </div>
        </nav>
        <section>
        <div class="hero">
            <h1>Edit Renter Details</h1>
            <form>
                <div class="date-time">
                    <p>
                        <label for="pckpdate-time">Pick-up Date/Time</label>
                        <span class="dt-pair">
                            <input type="date" id="pckpdate" required>
                            <input type="time" id="pckptime" required>
                        </span>
                    </p>
                    <p>
                        <label for="rtrndate-time">Return Date/Time</label>
                        <span class="dt-pair">
                            <input type="date" id="rtrndate" required>
                            <input type="time" id="rtrntime" required>
                        </span>
                    </p>
                </div>
                <div class="location">
                    <p>
                        <label for="pickuploc">Pickup Location</label>
                        <select id="pickuploc" required>
                            <option value="0">Please select location</option>
                            <option value="Manila">Manila</option>
                            <option value="Makati">Makati</option>
                            <option value="Pasig">Pasig</option>
                            <option value="Quezon City">Quezon City</option>
                        </select>
                    </p>
                    <p>
                        <label for="returnloc">Return Location</label>
                        <select id="returnloc" required>
                            <option value="0">Please select location</option>
                            <option value="Manila">Manila</option>
                            <option value="Makati">Makati</option>
                            <option value="Pasig">Pasig</option>
                            <option value="Quezon City">Quezon City</option>
                        </select>
                    </p>
                </div>
                <p class="same-loc">
                    <label for="return-loc">
                    <input type="checkbox" id="sameloc" required>Same as Pick-up Location</label>
                </p>
                <div class="c-details">
                    <p>
                        <label for="c_name">Name</label>
                        <input type="text" id="name" required>
                    </p>
                    <p>
                        <label for="c_email">Email</label>
                        <input type="email" id="email" required>
                    </p>
                    <p>
                        <label for="c_number">Number</label>
                        <input type="text" id="cnum" required>
                    </p>
                </div>
                <div class="addcustomer">
                    <input type="button" value="Update Customer" onclick="updateCustomer()">
                </div>
            </form>
        </div>
        </section>

        <p id="output"></p>
        <script type="text/javascript">

            var savedData = localStorage.getItem("renting_db");
              if (savedData == null) {
            
            var customer = [];
 
            localStorage.setItem(
                "renting_db",
                JSON.stringify(customer)
            );
 
            } else {
 
            var customer = JSON.parse(savedData);
 
            }
            var params = new URLSearchParams(window.location.search);
            var editIndex = params.get("edit");
            if (editIndex !== null) {
                var c = customer[editIndex];
                document.getElementById("pckpdate").value = c.pckpdate;
                document.getElementById("pckptime").value = c.pckptime;
                document.getElementById("rtrndate").value = c.rtrndate;
                document.getElementById("rtrntime").value = c.rtrntime;
                document.getElementById("pickuploc").value = c.pickuploc;
                document.getElementById("returnloc").value = c.returnloc;
                document.getElementById("name").value = c.name;
                document.getElementById("email").value = c.email;
                document.getElementById("cnum").value = c.cnum;

            }

            function updateCustomer() {
 
            var pckpdate = document.getElementById("pckpdate").value;
            var pckptime = document.getElementById("pckptime").value;
            var rtrndate = document.getElementById("rtrndate").value;
            var rtrntime = document.getElementById("rtrntime").value;
            var pickuploc = document.getElementById("pickuploc").value;
            var returnloc = document.getElementById("returnloc").value;
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var cnum = document.getElementById("cnum").value;
 
            customer[editIndex] = {
                pckpdate: pckpdate,
                pckptime: pckptime,
                rtrndate: rtrndate,
                rtrntime: rtrntime,
                pickuploc: pickuploc,
                returnloc: returnloc,
                name: name,
                email: email,
                cnum: cnum
            };
 
            localStorage.setItem(
                "renting_db",
                JSON.stringify(customer)
            );
 
            alert("Customr updated successfully.");
            setTimeout(function() {
                window.location.href = "bookings.html";
            }, 500);
 
 
            document.getElementById("message").innerHTML =
                "Customer updated successfully.";

            clearForm();
            displaycustomer();
        }

            document.getElementById("sameloc").addEventListener("change", function() {
            var pickuploc = document.getElementById("pickuploc");
            var returnloc = document.getElementById("returnloc");

            if (this.checked) {
            //copy the pickup location 
                returnloc.value = pickuploc.value;
                returnloc.disabled = true;
            } else {
            //pipili ng return location
                returnloc.disabled = false;
                returnloc.value = "0";
            }
            });
        </script>
            
    </body>
</html>
